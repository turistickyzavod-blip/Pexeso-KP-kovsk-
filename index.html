<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Pexeso</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; user-select: none; }
        h1 { color: #333; margin-bottom: 5px; }
        .score { font-size: 18px; margin-bottom: 15px; }
        
        /* Mřížka upravená pro 40 kartiček (8 sloupců na PC, méně na mobilu) */
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-width: 900px; width: 100%; }
        
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(5, 1fr); }
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
        }

        .card { aspect-ratio: 1; background-color: #0070f3; border-radius: 8px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-sizing: border-box; }
        .card-back { background-color: #0070f3; border: 2px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-front { background-color: #fff; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; padding: 4px; text-align: center; font-weight: bold; font-size: 11px; word-break: break-word; border: 2px solid #0070f3; }
        .card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .matched { visibility: hidden; pointer-events: none; }
        
        /* Tlačítko Reset */
        .reset-btn { margin-top: 25px; padding: 12px 24px; font-size: 16px; font-weight: bold; color: white; background-color: #28a745; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.2s, transform 0.1s; }
        .reset-btn:hover { background-color: #218838; }
        .reset-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>Moje Pexeso</h1>
    <div class="score">Počet tahů: <span id="moves">0</span></div>
    
    <div class="grid" id="grid"></div>
    
    <button class="reset-btn" onclick="resetGame()">Hrát znovu</button>

    <script>
        // SEZNAM 20 DVOJIC

            { id: 1, type: 'text', value: 'Pražský hrad' },

            { id: 4, type: 'text', value: 'Zvíkov' },
            
            { id: 5, type: 'image', value: 'https://ffe62a8958.cbaul-cdnwnd.com/6db8bb8c0bee1e71b39eb24bc2246e14/200000001-ef096ef098/1000023276.webp' },
            { id: 5, type: 'text', value: 'Hluboká' },

            { id: 6, type: 'text', value: 'Lednice' },

            { id: 13, type: 'text', value: 'Švihov' },

            { id: 15, type: 'image', value: 'https://ffe62a8958.cbaul-cdnwnd.com/6db8bb8c0bee1e71b39eb24bc2246e14/200000161-37b5237b54/1000042739.webp' },

            { id: 17, type: 'text', value: 'Kutná Hora - sv. Barbora' },
            
            { id: 18, type: 'image', value: 'https://ffe62a8958.cbaul-cdnwnd.com/6db8bb8c0bee1e71b39eb24bc2246e14/200000167-cf0facf0fc/1000042856.webp' },
            { id: 18, type: 'text', value: 'Chrám svatého Víta' },
            
            { id: 19, type: 'image', value: 'https://ffe62a8958.cbaul-cdnwnd.com/6db8bb8c0bee1e71b39eb24bc2246e14/200000169-41a7a41a7c/1000042741.webp' },
            { id: 19, type: 'text', value: 'Orloj - Praha' },
            
            { id: 20, type: 'image', value: 'https://ffe62a8958.cbaul-cdnwnd.com/6db8bb8c0bee1e71b39eb24bc2246e14/200000171-6b9a06b9a3/1000042857.webp' },
            { id: 20, type: 'text', value: 'Orloj - Olomouc' }
        ];

        const grid = document.getElementById('grid');
        let moves = 0;
        let flippedCards = [];
        let matchedCount = 0;

        function createBoard() {
            grid.innerHTML = ''; // Vyčištění plochy před vykreslením
            pairs.sort(() => 0.5 - Math.random()); // Náhodné zamíchání

            pairs.forEach((cardData, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = cardData.id;
                card.dataset.index = index;

                const back = document.createElement('div');
                back.classList.add('card-back');

                const front = document.createElement('div');
                front.classList.add('card-front');

                if (cardData.type === 'image') {
                    const img = document.createElement('img');
                    img.src = cardData.value;
                    front.appendChild(img);
                } else {
                    front.innerText = cardData.value;
                }

                card.appendChild(back);
                card.appendChild(front);
                grid.appendChild(card);

                card.addEventListener('click', flipCard);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    moves++;
                    document.getElementById('moves').innerText = moves;
                    setTimeout(checkMatch, 1000);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.id === card2.dataset.id) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount += 2;
                if (matchedCount === pairs.length) {
                    setTimeout(() => {
                        alert(`Gratulujeme! Zvládli jste celé pexeso na ${moves} tahů.`);
                    }, 500);
                }
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
            }
            flippedCards = [];
        }

        function resetGame() {
            moves = 0;
            matchedCount = 0;
            flippedCards = [];
            document.getElementById('moves').innerText = moves;
            createBoard();
        }

        // První spuštění hry při načtení stránky
        createBoard();
    </script>
</body>
</html>
